[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kokoro-gui"
version = "3.2.0"
description = "Kokoro text-to-speech with GUI and command-line interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.14.3",
    "EbookLib==0.20",
    "kokoro==0.9.4",
    "numpy==2.4.1",
    "pypdf==6.16.1",
    "scipy",
    "pedalboard",
    "soundfile==0.13.1",
    "sounddevice",
    "torch==2.13.0",
    "customtkinter",
    "rumps==0.4.0; sys_platform == 'darwin'",
]

[project.scripts]
kokoro-tts = "kokoro_cli:main"
kokoro-ttsd = "kokoro_daemon:main"
kokoro-ttsmenu = "kokoro_menubar:main"

[tool.setuptools]
py-modules = ["gui", "kokoro_cli", "kokoro_daemon", "kokoro_engine", "kokoro_menubar", "main", "paths", "playback"]
